name: iOS

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Both Xcode 26.3 and the iOS 26.2 runtime are installed on this image.
# See https://github.com/actions/runner-images/blob/main/images/macos/macos-15-Readme.md
env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

jobs:
  build-and-test:
    name: Flippie · build and test
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Record toolchain and simulator environment
        run: |
          set -o pipefail
          {
            xcodebuild -version
            xcodebuild -showsdks
            xcrun simctl list devices available
          } 2>&1 | tee "$RUNNER_TEMP/Flippie-environment.log"

      - name: Verify shared and package schemes
        run: |
          set -o pipefail
          xcodebuild -list -project Flippie.xcodeproj \
            2>&1 | tee "$RUNNER_TEMP/Flippie-schemes.log"

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Flippie.xcodeproj \
            -scheme Flippie \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.2' \
            -destination-timeout 60 \
            -parallel-testing-enabled NO \
            -derivedDataPath "$RUNNER_TEMP/Flippie-tests-derived-data" \
            -resultBundlePath "$RUNNER_TEMP/Flippie-tests.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RUNNER_TEMP/Flippie-tests.log"

      - name: Upload test results and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Flippie-tests-and-diagnostics
          path: |
            ${{ runner.temp }}/Flippie-tests.xcresult
            ${{ runner.temp }}/Flippie-tests.log
            ${{ runner.temp }}/Flippie-environment.log
            ${{ runner.temp }}/Flippie-schemes.log
          if-no-files-found: warn
          retention-days: 7

  lottie-version-matrix:
    name: Build · Lottie ${{ matrix.version }}
    runs-on: macos-15
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 3.0.0
            scheme: Lottie300
          - version: 3.5.0
            scheme: Lottie350
          - version: 4.0.0
            scheme: Lottie400
          - version: 4.6.1
            scheme: Lottie461

    steps:
      - uses: actions/checkout@v4

      - name: Record toolchain
        run: |
          set -o pipefail
          xcodebuild -version 2>&1 | tee "$RUNNER_TEMP/Lottie-toolchain.log"

      - name: Build isolated Lottie module
        run: |
          set -o pipefail
          xcodebuild build \
            -project Flippie.xcodeproj \
            -scheme '${{ matrix.scheme }}' \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/Lottie-${{ matrix.version }}-derived-data" \
            -resultBundlePath "$RUNNER_TEMP/Lottie-${{ matrix.version }}.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=YES \
            2>&1 | tee "$RUNNER_TEMP/Lottie-${{ matrix.version }}.log"

      - name: Upload module build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Lottie-${{ matrix.version }}-build
          path: |
            ${{ runner.temp }}/Lottie-${{ matrix.version }}.xcresult
            ${{ runner.temp }}/Lottie-${{ matrix.version }}.log
            ${{ runner.temp }}/Lottie-toolchain.log
          if-no-files-found: warn
          retention-days: 7
